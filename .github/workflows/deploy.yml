# build แล้วขึ้น GitHub Pages ทุกครั้งที่ push เข้า main (หรือกด Run workflow ในแท็บ Actions)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # แปลงไฟล์ Excel -> src/data/*.json ตอน build (vite.config.ts เรียก tools/export_data.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # GitHub Pages ไม่รู้จักเส้นทางของ React Router (/create, /rules): รีเฟรชแล้วจะได้ 404
      # ใช้หน้าแอปเดียวกันเป็นหน้า 404 แอปจึงเปิดหน้าที่ถูกต้องเอง
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
