<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adventurer's Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=IBM+Plex+Sans+Thai:wght@400;700&display=swap">
  <link rel="stylesheet" href="shared/css/textures.css">
  <link rel="stylesheet" href="shared/css/base.css">
  <style>
    .home {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }

    .roster-inner {
      padding: 22px 26px 28px;
    }

    .roster-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px 16px;
      flex-wrap: wrap;
    }

    .roster-head p {
      color: var(--ink-soft);
      max-width: 52ch;
    }

    .roster-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .hero {
      position: relative;
      display: grid;
      gap: 10px;
      padding: 14px 16px 14px;
      border: 1px solid rgba(138, 109, 74, 0.5);
      border-radius: 6px;
      background: rgba(255, 249, 230, 0.45);
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-crest {
      flex: none;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: radial-gradient(circle at 40% 30%, var(--wood-light), var(--wood-dark));
      color: var(--gold-bright);
      font-size: var(--step-1);
      font-weight: 800;
      box-shadow: 0 2px 4px rgba(40, 20, 5, 0.4);
    }

    .hero-name {
      font-size: var(--step-1);
      font-weight: 800;
      font-variation-settings: "wdth" 82;
      line-height: 1.2;
    }

    .hero-meta {
      font-size: var(--step--1);
      color: var(--ink-soft);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: center;
    }

    .hero-stats li {
      padding: 3px 0;
      border-radius: 4px;
      background: linear-gradient(180deg, #6f4728, #4a2e1b);
      color: var(--parchment-light);
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .hero-stats b {
      display: block;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold-bright);
    }

    .hero-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: var(--step--1);
    }

    .hero-skill {
      color: var(--blood);
      font-weight: 700;
    }

    .hero-remove {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-faint);
      cursor: pointer;
      transition: color var(--dur-fast) ease, border-color var(--dur-fast) ease;
    }

    .hero-remove:hover,
    .hero-remove[data-armed] {
      color: var(--blood);
      border-color: rgba(142, 44, 32, 0.45);
    }

    .roster-empty {
      grid-column: 1 / -1;
      padding: 24px 0 8px;
      color: var(--ink-soft);
    }

    @media (max-width: 640px) {
      .home { padding: 20px 16px 32px; }
      .roster-inner { padding: 18px 16px 22px; }
    }

  </style>
</head>
<body>
  <header class="banner" id="banner" data-active="characters"></header>

  <main class="home">
    <section class="frame parchment unfurl" aria-labelledby="rosterTitle">
      <h1 class="panel-title" id="rosterTitle">Character Sheets <span class="th" lang="th">ตัวละครของฉัน</span></h1>
      <div class="roster-inner">
        <div class="roster-head">
          <p lang="th">นักผจญภัยทุกคนที่คุณบันทึกไว้ในตำรา พร้อมออกเดินทางเมื่อเรื่องราวเปิดให้เล่น</p>
          <a class="btn btn-gold" href="character-create/index.html">Create Character</a>
        </div>
        <div class="flourish" aria-hidden="true"></div>
        <ul class="roster-list" id="roster"></ul>
      </div>
    </section>
  </main>

  <script src="data/skills.js"></script>
  <script src="data/gamedata.js"></script>
  <script src="shared/js/storage.js"></script>
  <script src="shared/js/banner.js"></script>
  <script src="shared/js/fx.js"></script>
  <script>
    (function () {
      const { skills, races, abilities, alignments } = window.DND_DATA;
      const list = document.getElementById("roster");
      const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      function render(enter) {
        const heroes = window.DND_STORE.list().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
        if (!heroes.length) {
          list.innerHTML = '<li class="roster-empty" lang="th">ยังไม่มีนักผจญภัย เริ่มจากสร้างตัวละครตัวแรกของคุณ</li>';
          return;
        }
        list.innerHTML = heroes.map((h) => {
          const race = races.find((r) => r.id === h.race);
          const heroSkills = (h.skills || []).map((id) => skills.find((s) => s.id === id)).filter(Boolean);
          const al = alignments.find((a) => a.id === h.alignment);
          return `
            <li class="hero">
              <div class="hero-top">
                <span class="hero-crest" aria-hidden="true">${esc(h.class[0])}</span>
                <div>
                  <p class="hero-name">${esc(h.name)}</p>
                  <p class="hero-meta">${race ? race.nameEn : esc(h.race)} ${esc(h.class)}, HP ${h.hp}, AC ${h.ac}${al ? `, ${al.en}` : ""}</p>
                </div>
              </div>
              <ul class="hero-stats">
                ${abilities.map((a) => `<li>${a.id}<b>${h.abilities[a.id] ?? "—"}</b></li>`).join("")}
              </ul>
              <div class="hero-foot">
                <span class="hero-skill">${heroSkills.map((s) => s.nameEn).join(" · ")}</span>
                <button type="button" class="hero-remove" data-remove="${h.id}" aria-label="Delete ${esc(h.name)}">Delete</button>
              </div>
            </li>`;
        }).join("");
        if (enter) {
          list.style.setProperty("--fx-base", "800ms");
          window.FX.stagger(list, ".hero");
        }
      }

      // กดครั้งแรกเพื่อเตรียมลบ กดซ้ำเพื่อยืนยัน (ไม่ใช้ confirm() ของเบราว์เซอร์)
      list.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-remove]");
        if (!btn) return;
        if (btn.dataset.armed) {
          window.DND_STORE.remove(btn.dataset.remove);
          render();
        } else {
          btn.dataset.armed = "1";
          btn.textContent = "Click again to delete";
        }
      });

      render(true);
    })();
  </script>
</body>
</html>
